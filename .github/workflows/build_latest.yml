name: Build Latest Release Termux

env:
  DOTNET_SDK_VERSION: "9.0.*"

on:
  workflow_dispatch:

jobs:
  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
          
      - name: Build for Linux ARM64
        run: dotnet publish csplayready -c Release -r linux-arm64 --self-contained true
        
      - name: Tar ARM64 Release
        run: tar -czf csplayready-linux-arm64.tar.gz -C csplayready/bin/Release/net9.0/linux-arm64/publish/ .
        
      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v3
        with:
          name: csplayready-linux-arm64
          path: csplayready-linux-arm64.tar.gz
